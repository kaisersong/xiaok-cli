name: Desktop startup and room recovery

on:
  push:
    branches: [master]
    paths:
      - 'desktop/**'
      - 'src/runtime/task-host/**'
      - 'tests/runtime/task-host/**'
      - 'tests/native/accepted-root-candidate-identity.test.mjs'
      - 'tests/native/protected-core-model-sdk.test.mjs'
      - 'tests/native/fixtures/protected-core-model-sdk.cjs'
      - 'tests/native/fixtures/protected-core-model-sdk-entry.ts'
      - 'tests/native/fixtures/accepted-root-candidate-identity.cjs'
      - 'tests/native/fixtures/accepted-root-binding-entry.ts'
      - 'tests/native/helpers/accepted-root-candidate-observation.*'
      - 'native/main-installation/**'
      - 'scripts/build-main-installation-artifacts.mjs'
      - 'tests/native/main-installation-*.test.mjs'
      - 'tests/native/fixtures/main-installation-*'
      - 'tests/native/helpers/main-installed-fixture.mjs'
      - 'native/root-resource-authority/**'
      - 'native/protected-sqlite-facade/**'
      - 'package*.json'
      - '.github/workflows/desktop-startup-room-recovery.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'src/runtime/task-host/**'
      - 'tests/runtime/task-host/**'
      - 'tests/native/accepted-root-candidate-identity.test.mjs'
      - 'tests/native/protected-core-model-sdk.test.mjs'
      - 'tests/native/fixtures/protected-core-model-sdk.cjs'
      - 'tests/native/fixtures/protected-core-model-sdk-entry.ts'
      - 'tests/native/fixtures/accepted-root-candidate-identity.cjs'
      - 'tests/native/fixtures/accepted-root-binding-entry.ts'
      - 'tests/native/helpers/accepted-root-candidate-observation.*'
      - 'native/main-installation/**'
      - 'scripts/build-main-installation-artifacts.mjs'
      - 'tests/native/main-installation-*.test.mjs'
      - 'tests/native/fixtures/main-installation-*'
      - 'tests/native/helpers/main-installed-fixture.mjs'
      - 'native/root-resource-authority/**'
      - 'native/protected-sqlite-facade/**'
      - 'package*.json'
      - '.github/workflows/desktop-startup-room-recovery.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  recovery:
    name: Startup and room (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-15]
        node: ['22.14.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci --ignore-scripts
      - run: cd desktop && npm ci --ignore-scripts
      - name: Install the locked Electron runtime for real module imports
        working-directory: desktop
        run: node node_modules/electron/install.js
      - run: npm run test:sandbox:build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Real host recovery ordering and durable receipts
        run: >
          npm run test:sandbox:run --
          .test-dist/tests/runtime/task-host/task-recovery-race.test.js
          .test-dist/tests/runtime/task-host/task-runtime-host.test.js
          .test-dist/tests/runtime/task-host/project-handoff-delivery.test.js
      - name: Startup ownership, execution admission and room IPC
        run: >
          cd desktop && npm run test -- --run
          tests/main/desktop-startup-task-recovery.test.ts
          tests/main/collaboration-room-risk-profile.test.ts
          tests/main/collaboration-room-ipc-registry.test.ts
          tests/main/collaboration-room-service.test.ts
          tests/main/kswarm-project-agent-ipc-registry.test.ts
          tests/main/kswarm-proxy-ipc-registry.test.ts

      - name: Desktop deadline boundaries at the declared Node floor
        working-directory: desktop
        run: >
          node node_modules/vitest/vitest.mjs run --environment node
          tests/main/kswarm-task-review-prompt.test.ts
          tests/main/kswarm-review-files.test.ts
          tests/main/project-agent-model.test.ts
          tests/main/workflow-deadline-policy.test.ts
          tests/main/workflow-deadline-late-summary.test.ts
          tests/main/kswarm-execution-clock.test.ts
          tests/main/desktop-tool-loop-recovery.test.ts

      - name: Prepare pinned native candidate fixtures (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          git clone --no-checkout --depth 1 https://github.com/kaisersong/kswarm.git ../kswarm
          git -C ../kswarm fetch --depth 1 origin fe0b4688c65b85e8d50c3c72db6f4d5027c0e80c
          git -C ../kswarm checkout --detach FETCH_HEAD
          git clone --no-checkout --depth 1 https://github.com/kaisersong/intent-broker.git ../intent-broker
          git -C ../intent-broker fetch --depth 1 origin a323d728ed979570dc81b2fad3be57715ce7e6eb
          git -C ../intent-broker checkout --detach FETCH_HEAD
          npm ci --ignore-scripts --omit=dev --prefix ../kswarm
          npm ci --ignore-scripts --omit=dev --prefix ../intent-broker
      - name: Uninstalled candidate and owned preparation boundaries (macOS)
        if: runner.os == 'macOS'
        working-directory: desktop
        run: >-
          node node_modules/vitest/vitest.mjs run --maxWorkers=1 --minWorkers=1
          tests/main/kswarm-owned-preparation-service.test.ts
          tests/main/kswarm-uninstalled-candidate.test.ts
      - name: Prepare locked Electron headers for genuine Main (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          electron_version="$(node -p "require('./desktop/node_modules/electron/package.json').version")"
          headers_root="$(mktemp -d "$RUNNER_TEMP/xiaok-candidate-electron-headers.XXXXXX")"
          NODE_VERSION="v$electron_version" NODE_ARCH="$(node -p process.arch)" HEADERS_DIR="$headers_root" DIST_URL=https://electronjs.org/headers FALLBACK_DIST_URL=https://electronjs.org/headers bash .github/actions/node-headers/fetch-node-headers.sh
          test -s "$headers_root/include/node/node_api.h"
          test -s "$headers_root/include/node/v8.h"
          echo "XIAOK_MAIN_BOOTSTRAP_TEST_HEADERS=$headers_root/include/node" >> "$GITHUB_ENV"
      - name: Genuine Main candidate identity and lifecycle (macOS)
        if: runner.os == 'macOS'
        run: node --test tests/native/accepted-root-candidate-identity.test.mjs

      - name: Fixed installation certificate and original helper (macOS)
        if: runner.os == 'macOS'
        run: >-
          node --test --test-concurrency=1
          tests/native/main-installation-certificate.test.mjs
          tests/native/main-installation-helper.test.mjs

      - name: Genuine Main protected Core model SDK fresh and restored (macOS)
        if: runner.os == 'macOS'
        run: node --test tests/native/protected-core-model-sdk.test.mjs

  approved-workflow-deadline:
    name: Approved workflow deadline (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.22.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci --ignore-scripts
      - run: cd desktop && npm ci --ignore-scripts
      - name: Install the locked Electron runtime for real module imports
        working-directory: desktop
        run: node node_modules/electron/install.js
      - name: Prepare pinned workflow issuer and broker
        shell: bash
        run: |
          git clone --no-checkout --depth 1 https://github.com/kaisersong/kswarm.git ../kswarm
          git -C ../kswarm fetch --depth 1 origin fe0b4688c65b85e8d50c3c72db6f4d5027c0e80c
          git -C ../kswarm checkout --detach FETCH_HEAD
          git clone --no-checkout --depth 1 https://github.com/kaisersong/intent-broker.git ../intent-broker
          git -C ../intent-broker fetch --depth 1 origin a323d728ed979570dc81b2fad3be57715ce7e6eb
          git -C ../intent-broker checkout --detach FETCH_HEAD
          npm ci --ignore-scripts --omit=dev --prefix ../kswarm
          npm ci --ignore-scripts --omit=dev --prefix ../intent-broker
      - name: Real issuer, Main runner, queue, retry and read-port boundaries
        env:
          XIAOK_WORKFLOW_TEST_REPO_ROOT: ${{ github.workspace }}
        run: >
          cd desktop && npm run test -- --maxWorkers=2 --environment node --run
          tests/main/kswarm-task-review-scope-integration.test.ts
          tests/main/workflow-approved-deadline.test.ts
          tests/main/kswarm-task-review-prompt.test.ts
          tests/main/kswarm-review-files.test.ts
          tests/main/project-agent-model.test.ts
          tests/main/workflow-deadline-policy.test.ts
          tests/main/workflow-budget-read-lifecycle.test.ts
          tests/main/workflow-deadline-late-summary.test.ts
          tests/main/kswarm-execution-clock.test.ts
          tests/main/desktop-tool-loop-recovery.test.ts
          tests/main/workflow-read-port-provenance.test.ts
          tests/main/workflow-read-port-close-reentry.test.ts
          tests/main/workflow-stored-restrictions-partial-denial.test.ts
          tests/main/workflow-stored-restrictions-denials.test.ts
          tests/main/workflow-stored-restrictions-effects.test.ts
