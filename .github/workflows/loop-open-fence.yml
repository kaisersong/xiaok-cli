name: Loop ordinary route fence
on:
  push:
    branches: [master]
    paths:
      - 'desktop/electron/loop-*.ts'
      - 'desktop/electron/completion-evidence-store.ts'
      - 'src/runtime/verification/**'
      - 'tests/runtime/verification/loop-database-source-route.test.ts'
      - 'desktop/tests/main/loop-database-owner.test.ts'
      - 'desktop/tests/main/loop-database-metadata.test.ts'
      - 'desktop/tests/main/loop-database-source-observation.test.ts'
      - 'desktop/tests/main/loop-store.test.ts'
      - 'desktop/tests/main/completion-evidence-store.test.ts'
      - 'tests/support/**'
      - 'desktop/tests/setup.ts'
      - 'desktop/tests/profile-account.setup.mjs'
      - 'desktop/tests/setup-host-env.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'desktop/package.json'
      - 'desktop/package-lock.json'
      - 'vitest.config.ts'
      - 'desktop/vitest.config.ts'
      - 'desktop/tsconfig*.json'
      - 'scripts/generate-desktop-service-overrides.mjs'
      - '.github/workflows/loop-open-fence.yml'
  pull_request:
    paths:
      - 'desktop/electron/loop-*.ts'
      - 'desktop/electron/completion-evidence-store.ts'
      - 'src/runtime/verification/**'
      - 'tests/runtime/verification/loop-database-source-route.test.ts'
      - 'desktop/tests/main/loop-database-owner.test.ts'
      - 'desktop/tests/main/loop-database-metadata.test.ts'
      - 'desktop/tests/main/loop-database-source-observation.test.ts'
      - 'desktop/tests/main/loop-store.test.ts'
      - 'desktop/tests/main/completion-evidence-store.test.ts'
      - 'tests/support/**'
      - 'desktop/tests/setup.ts'
      - 'desktop/tests/profile-account.setup.mjs'
      - 'desktop/tests/setup-host-env.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'desktop/package.json'
      - 'desktop/package-lock.json'
      - 'vitest.config.ts'
      - 'desktop/vitest.config.ts'
      - 'desktop/tsconfig*.json'
      - 'scripts/generate-desktop-service-overrides.mjs'
      - '.github/workflows/loop-open-fence.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  loop-route:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        node: ['22.14.0', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact event head before dependency installation
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_head="$(git rev-parse HEAD)"
          test "$actual_head" = "$EXPECTED_HEAD"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: Install root locked dependencies
        run: npm ci --ignore-scripts
      - name: Prepare the original root native SQLite dependency
        run: npm rebuild better-sqlite3
      - name: Run the complete root source-route whole
        run: >-
          npm run test:full -- --config vitest.config.ts
          tests/runtime/verification/loop-database-source-route.test.ts
          --maxWorkers=1 --reporter=verbose --reporter=json
          --outputFile=loop-open-fence-root-whole.json
      - name: Install Desktop locked dependencies (Node24 only)
        if: ${{ matrix.node == '24' }}
        working-directory: desktop
        run: npm ci --ignore-scripts
      - name: Run the five complete Main wholes with Desktop Vitest (Node24 only)
        if: ${{ matrix.node == '24' }}
        working-directory: desktop
        run: >-
          node node_modules/vitest/vitest.mjs run --config vitest.config.ts
          tests/main/loop-database-owner.test.ts
          tests/main/loop-database-metadata.test.ts
          tests/main/loop-database-source-observation.test.ts
          tests/main/loop-store.test.ts
          tests/main/completion-evidence-store.test.ts
          --maxWorkers=1 --reporter=verbose --reporter=json
          --outputFile=loop-open-fence-main-wholes.json
      # build:main's existing generator requires this source file. Reuse the
      # exact KSwarm pin in desktop-release.yml; do not install/start the service.
      - name: Read pinned KSwarm source required by the original Main build
        if: ${{ matrix.node == '24' }}
        uses: actions/checkout@v4
        with:
          repository: kaisersong/kswarm
          ref: 16c3ed14c5493a82d000d69d34e4b1c933187433
          path: kswarm
      - name: Build Desktop Main (Node24 only)
        if: ${{ matrix.node == '24' }}
        working-directory: desktop
        run: npm run build:main
      - name: Preserve actual whole identities and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loop-open-fence-${{ matrix.os }}-node-${{ matrix.node }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            loop-open-fence-root-whole.json
            desktop/loop-open-fence-main-wholes.json
          if-no-files-found: warn
