name: Conversation activity owner lifecycle
on:
  push:
    branches: [master]
    paths:
      - 'src/runtime/conversation-activity/**'
      - 'tests/runtime/conversation-activity/**'
      - 'tests/support/**'
      - 'scripts/copy-test-assets.mjs'
      - 'scripts/verification/copy-windows-absence.mjs'
      - 'desktop/electron/*.mjs'
      - 'scripts/copy-glob-worker.mjs'
      - 'scripts/repair-better-sqlite3-types.cjs'
      - 'package*.json'
      - 'tsconfig*.json'
      - 'vitest.sandbox.config.mjs'
      - '.github/workflows/conversation-activity-owner.yml'
  pull_request:
    paths:
      - 'src/runtime/conversation-activity/**'
      - 'tests/runtime/conversation-activity/**'
      - 'tests/support/**'
      - 'scripts/copy-test-assets.mjs'
      - 'scripts/verification/copy-windows-absence.mjs'
      - 'desktop/electron/*.mjs'
      - 'scripts/copy-glob-worker.mjs'
      - 'scripts/repair-better-sqlite3-types.cjs'
      - 'package*.json'
      - 'tsconfig*.json'
      - 'vitest.sandbox.config.mjs'
      - '.github/workflows/conversation-activity-owner.yml'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  owner-lifecycle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-2022]
        node: ['22.14.0', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact event head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Prepare the fixed KSwarm test child Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - name: Retain the absolute KSwarm test child executable
        id: ks_test_node
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, 'executable=' + process.execPath + '\n')"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Keep client Node and KSwarm test child Node separate
        env:
          KS_TEST_NODE_EXECUTABLE: ${{ steps.ks_test_node.outputs.executable }}
        run: node -e "const fs=require('node:fs'),path=require('node:path');const child=process.env.KS_TEST_NODE_EXECUTABLE;if(!child||!path.isAbsolute(child))throw Error('ks_test_node_missing');fs.appendFileSync(process.env.GITHUB_ENV,'XIAOK_WORKFLOW_TEST_KSWARM_NODE_EXECUTABLE='+child+'\n');console.log(JSON.stringify({clientNode:process.versions.node,clientExecutable:process.execPath,ksChildExecutable:child}));"
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Clone pinned KSwarm sibling for the real KS startup case
        shell: bash
        run: |
          git clone --no-checkout --depth 1 https://github.com/kaisersong/kswarm.git ../kswarm
          git -C ../kswarm fetch --depth 1 origin fdafa5a1558e8fd791aee1e97f9951e8841b99dd
          git -C ../kswarm checkout --detach FETCH_HEAD
          test "$(git -C ../kswarm rev-parse HEAD)" = fdafa5a1558e8fd791aee1e97f9951e8841b99dd
          bash .github/scripts/retry.sh npm ci --ignore-scripts --omit=dev --prefix ../kswarm
      - name: Compile original test graph and copy its assets
        run: npm run test:sandbox:build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Check original owner and readonly lifecycle files
        shell: bash
        run: |
          set -o pipefail
          node -r ./tests/support/vite-net-use-patch.cjs ./node_modules/vitest/vitest.mjs run --no-cache --config vitest.sandbox.config.mjs --configLoader runner --maxWorkers=1 --minWorkers=1 \
            .test-dist/tests/runtime/conversation-activity/owner-process.test.js \
            .test-dist/tests/runtime/conversation-activity/owner-lock-start.test.js \
            .test-dist/tests/runtime/conversation-activity/store-write-unconfirmed.post-only.test.js \
            .test-dist/tests/runtime/conversation-activity/native-source-store-floor.test.js \
            .test-dist/tests/runtime/conversation-activity/storage-permissions.test.js \
            .test-dist/tests/runtime/conversation-activity/owner-launcher-exit.test.js \
            .test-dist/tests/runtime/conversation-activity/owner-protocol.test.js \
            .test-dist/tests/runtime/conversation-activity/owner-host.test.js \
            .test-dist/tests/runtime/conversation-activity/owner-retire.test.js \
            .test-dist/tests/runtime/conversation-activity/readonly-compat.test.js \
            .test-dist/tests/runtime/conversation-activity/owner-pending-tasks.test.js \
            .test-dist/tests/runtime/conversation-activity/source-supervisor.test.js 2>&1 | tee owner-lifecycle.log
      - name: Preserve actual lifecycle test results
        if: always() && hashFiles('owner-lifecycle.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: conversation-owner-${{ matrix.os }}-node-${{ matrix.node }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: owner-lifecycle.log
          if-no-files-found: error
