name: Diagnostic Windows owner facts
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  native-security:
    runs-on: windows-2022
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Capture actual SID and ACL facts from the fixed native artifact
        shell: pwsh
        run: |
          node --input-type=commonjs -e @'
          const fs=require('node:fs'),path=require('node:path'),os=require('node:os'),crypto=require('node:crypto');
          const dir=path.resolve('data/windows-owner-security/win32-x64');
          const manifest=JSON.parse(fs.readFileSync(path.join(dir,'windows_owner_security.json'),'utf8'));
          const file=path.join(dir,'windows_owner_security.node');
          if(crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex')!==manifest.sha256)throw Error('artifact hash mismatch');
          const sdk=require(file),root=fs.realpathSync(fs.mkdtempSync(path.join(os.tmpdir(),'xiaok-owner-facts-'))),child=path.join(root,'native-private');
          try{if(sdk.createPrivateDirectory(child)!==true)throw Error('exclusive create failed');console.log(JSON.stringify({diagnosticOnly:true,sha:process.env.GITHUB_SHA,napi:process.versions.napi,plain:sdk.inspect(root),nativePrivate:sdk.inspect(child)}));}
          finally{fs.rmSync(root,{recursive:true,force:true});}
          '@
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
