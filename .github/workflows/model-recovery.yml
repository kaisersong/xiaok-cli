name: Model request recovery
on:
  merge_group: {}
  push:
    branches: [master]
  pull_request:
    paths:
      - 'src/ai/adapters/openai.ts'
      - 'src/ai/providers/**'
      - 'src/ai/models.ts'
      - 'src/ai/runtime/**'
      - 'tests/ai/providers/**'
      - 'tests/ai/adapters/openai.test.ts'
      - 'tests/ai/models.test.ts'
      - 'tests/ai/adapters/openai-provider-sse-error.test.ts'
      - 'tests/ai/runtime/**'
      - 'tests/e2e/kimi-error-recovery*'
      - '.github/workflows/model-recovery.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vitest*.config.*'
      - '.github/actions/**'
      - '.github/scripts/**'
      - '.github/ci/**'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  recovery:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-15]
        node: ['22.14.0', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:sandbox:build
      - name: Test Kimi diagnostics, retries, cancellation and completed tools
        run: >
          npm run test:sandbox:run --
          .test-dist/tests/ai/adapters/openai.test.js
          .test-dist/tests/ai/providers/registry.test.js
          .test-dist/tests/ai/providers/control-plane.test.js
          .test-dist/tests/ai/providers/normalize.test.js
          .test-dist/tests/ai/runtime/model-capabilities.test.js
          .test-dist/tests/ai/models.test.js
          .test-dist/tests/ai/adapters/openai-provider-sse-error.test.js
          .test-dist/tests/ai/runtime/model-stream-recovery.test.js
          .test-dist/tests/ai/runtime/model-text-repetition.test.js
          .test-dist/tests/ai/runtime/agent-model-recovery.test.js
          .test-dist/tests/ai/runtime/abort-error-discrimination.test.js
          .test-dist/tests/ai/runtime/agent-runtime.test.js
          .test-dist/tests/ai/runtime/provider-request-error.test.js
          .test-dist/tests/ai/providers/kimi-k31.test.js
          .test-dist/tests/ai/providers/control-plane.test.js
          .test-dist/tests/ai/providers/model-harness-profile.test.js
          .test-dist/tests/ai/providers/model-runtime-options.test.js
          .test-dist/tests/ai/providers/model-reasoning-effort.test.js
          .test-dist/tests/ai/runtime/model-harness-identity.test.js
          .test-dist/tests/ai/runtime/provider-transcript-digest.test.js
          .test-dist/tests/ai/runtime/provider-conversation-authorization.test.js
          .test-dist/tests/ai/runtime/kimi-rollback-policy.test.js
          .test-dist/tests/ai/runtime/session-store.test.js
