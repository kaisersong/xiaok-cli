# TEMPORARY (1.6.3 gate for #162): 20 fresh-process runs of desktop-memory-store-close on Windows.
# Lives only on branch ci/1.6.3-win-memclose-x20; never merge to master.
name: TMP Windows memory-close x20
on:
  push:
    branches: [ci/1.6.3-win-memclose-x20]
jobs:
  memclose-x20:
    name: memory-close x20 (windows-2022, Node ${{ matrix.node }})
    runs-on: windows-2022
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        node: ['22.14.0', '24.16.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: Prepare node-gyp headers
        uses: ./.github/actions/node-headers
      - name: Install root dependencies
        shell: bash
        run: bash .github/scripts/retry.sh npm ci
      - name: Install desktop dependencies
        shell: bash
        run: cd desktop && bash ../.github/scripts/retry.sh npm ci --ignore-scripts
      - name: Diagnose Electron install on matrix Node (non-fatal)
        working-directory: desktop
        shell: bash
        continue-on-error: true
        run: |
          node -v
          node node_modules/electron/install.js; echo "install.js exit=$?"
          ls -la node_modules/electron/ || true
          ls node_modules/electron/dist 2>/dev/null | head -20 || echo "no dist dir"
      - name: Switch to Node 22.14.0 for the Electron binary install
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - name: Install the locked Electron runtime (Node 22, binary is Node-independent)
        working-directory: desktop
        shell: bash
        run: |
          node -v
          test -f node_modules/electron/path.txt || { rm -rf node_modules/electron/dist; node node_modules/electron/install.js; }
          test -f node_modules/electron/path.txt
          echo "electron path: $(cat node_modules/electron/path.txt)"
      - name: Switch back to matrix Node for compile and tests
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Confirm matrix Node
        shell: bash
        run: node -v
      - name: Compile the real main graph
        working-directory: desktop
        shell: bash
        run: |
          node node_modules/typescript/bin/tsc -p tsconfig.electron.json
          node ../scripts/copy-harness-runtime.mjs
          node ../scripts/copy-glob-worker.mjs dist/main/src/ai/tools
          node scripts/copy-broker-runtime-package.cjs
          test -f dist/main/desktop/electron/broker-runtime-package.cjs
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Run desktop-memory-store-close 20 times (fresh process each)
        working-directory: desktop
        shell: bash
        run: |
          pass=0; fail=0
          for i in $(seq 1 20); do
            echo "::group::run $i/20"
            if npm run test -- --run tests/main/desktop-memory-store-close.test.ts; then pass=$((pass+1)); r=PASS; else fail=$((fail+1)); r=FAIL; fi
            echo "::endgroup::"
            echo "run $i/20: $r"
          done
          echo "RESULT node=${{ matrix.node }} sha=${GITHUB_SHA} pass=$pass fail=$fail" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$fail" -eq 0
