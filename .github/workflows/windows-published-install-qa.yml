name: Manual Windows activity storm diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-storm:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 6ae36d1f08789706dd8c0ab94e6cfc906f061e27
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - name: Install original dependencies
        shell: bash
        run: bash .github/scripts/retry.sh npm ci
      - name: Install original Desktop dependencies
        shell: bash
        run: cd desktop && bash ../.github/scripts/retry.sh npm ci --ignore-scripts
      - name: Run original storm with its unchanged 5 second limit
        shell: bash
        run: cd desktop && npm test -- --run --maxWorkers=1 tests/main/conversation-activity-store.test.ts -t 'bounds a 10000-progress storm'
