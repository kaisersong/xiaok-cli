name: Manual real Windows NSIS upgrade QA
on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        default: '1.6.4'
        type: string
      tag:
        required: true
        default: 'desktop-v1.6.4'
        type: string
      fullSHA:
        required: true
        type: string
      expectedInstallerSHA256:
        required: true
        type: string
      expectedReleaseID:
        required: true
        type: string
      expectedReleaseState:
        required: true
        type: choice
        default: published
        options: [published, draft]
permissions:
  contents: read
jobs:
  installed-path-qa:
    if: github.repository == 'kaisersong/xiaok-cli' && github.event_name == 'workflow_dispatch' && inputs.expectedReleaseState == 'published'
    runs-on: windows-2022
    timeout-minutes: 20
    steps: &installed_qa_steps
      - uses: actions/checkout@v4
        with:
          repository: kaisersong/xiaok-cli
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify identified installers and upgrade 1.6.2 to 1.6.4
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          QA_VERSION: ${{ inputs.version }}
          QA_TAG: ${{ inputs.tag }}
          QA_RELEASE_SHA: ${{ inputs.fullSHA }}
          QA_INSTALLER_SHA256: ${{ inputs.expectedInstallerSHA256 }}
          QA_RELEASE_ID: ${{ inputs.expectedReleaseID }}
          QA_RELEASE_STATE: ${{ inputs.expectedReleaseState }}
        run: |
          & ./scripts/qa/windows-real-upgrade.ps1 -Version $env:QA_VERSION -Tag $env:QA_TAG -FullSHA $env:QA_RELEASE_SHA -ExpectedInstallerSHA256 $env:QA_INSTALLER_SHA256 -ExpectedReleaseID $env:QA_RELEASE_ID -ExpectedReleaseState $env:QA_RELEASE_STATE
      - name: Preserve actual QA receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-real-upgrade-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/xiaok-installed-qa-${{ github.run_id }}-${{ github.run_attempt }}/evidence/
          if-no-files-found: warn
  draft-installed-path-qa:
    if: github.repository == 'kaisersong/xiaok-cli' && github.event_name == 'workflow_dispatch' && inputs.expectedReleaseState == 'draft'
    permissions:
      contents: write
    runs-on: windows-2022
    timeout-minutes: 20
    steps: *installed_qa_steps
