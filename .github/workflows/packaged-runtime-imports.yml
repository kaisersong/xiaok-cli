name: Packaged fixed Node imports
on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - 'desktop/tests/main/packaged-runtime-imports.test.ts'
      - 'desktop/tests/main/packaged-runtime-dependencies.test.ts'
      - 'desktop/scripts/verify-packaged-runtime-dependencies.cjs'
      - 'desktop/scripts/pack-node-child.cjs'
      - 'desktop/scripts/prune-node-child.cjs'
      - 'desktop/tests/main/prune-node-child.test.ts'
      - 'desktop/scripts/pack-broker-runtime.cjs'
      - 'desktop/electron/node-child-*'
      - 'desktop/electron/broker-runtime-*'
      - 'desktop/resources/broker-runtime-lock.json'
      - 'desktop/package*.json'
      - 'package*.json'
      - '.github/workflows/desktop-release.yml'
      - '.github/workflows/packaged-runtime-imports.yml'
permissions:
  contents: read
concurrency:
  group: packaged-runtime-imports-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  fixed-node-imports:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-22.04]
        node: ['22.22.1', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert the exact selected source
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix desktop
      - name: Install the locked Electron distribution
        run: node desktop/node_modules/electron/install.js
      - name: Prepare the verified fixed child Node runtime
        run: node desktop/scripts/prepare-broker-runtime.mjs
      - name: Exercise all original package import and dependency contracts
        run: npm run test --prefix desktop -- --run tests/main/packaged-runtime-imports.test.ts tests/main/packaged-runtime-dependencies.test.ts tests/main/prune-node-child.test.ts
