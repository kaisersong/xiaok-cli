name: Verification registration
on:
  merge_group: {}
  push:
    branches: [master]
  pull_request:
    paths:
      - 'src/runtime/verification/**'
      - 'src/runtime/goal/**'
      - 'tests/runtime/verification/**'
      - 'tests/support/**'
      - 'scripts/verification/**'
      - 'tests/verification/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.ts'
      - '.github/workflows/verification-registration.yml'
      - 'tsconfig*.json'
      - 'vitest*.config.*'
      - '.github/actions/**'
      - '.github/scripts/**'
      - '.github/ci/**'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  runtime-archives:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact event head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check original runtime archive and required QEMU payload
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests/verification -p 'test_runtime_*.py' -v 2>&1 | tee runtime-archive-tests.log
      - name: Preserve actual archive regression cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-archives-${{ matrix.os }}-python-${{ matrix.python }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime-archive-tests.log
          if-no-files-found: error
  registration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        node: ['22.14.0', '24']
        shard: [1, 2, 3]
    runs-on: ${{ matrix.os }}
    # Job ceiling only; original per-case/config deadlines are unchanged.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Assert exact event head before dependency installation
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_head="$(git rev-parse HEAD)"
          test "$actual_head" = "$EXPECTED_HEAD"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Prepare node-gyp headers (retrying download, cached)
        uses: ./.github/actions/node-headers
      - name: Install locked dependencies without unrelated lifecycle scripts
        shell: bash
        run: bash .github/scripts/retry.sh npm ci --ignore-scripts
      - name: Prepare the original native SQLite dependency
        shell: bash
        run: bash .github/scripts/retry.sh npm rebuild better-sqlite3
      - name: Run the nine complete source wholes
        if: matrix.shard == 1
        run: >-
          npm run test:full -- --config vitest.config.ts
          tests/runtime/verification/registration-private-primitive-vector.test.ts
          tests/runtime/verification/intent-registration-census.test.ts
          tests/runtime/verification/registration-value-snapshot.test.ts
          tests/runtime/verification/registration-intrinsic-fences.test.ts
          tests/runtime/verification/registration-own-data-boundary.test.ts
          tests/runtime/verification/registration-native-row-copy.test.ts
          tests/runtime/verification/owner-enrollment-authority.test.ts
          tests/runtime/verification/registration-native-descriptor-shape.test.ts
          tests/runtime/verification/registration-statement-mode.test.ts
          --maxWorkers=1 --reporter=verbose --reporter=json
          --outputFile=verification-registration-source-wholes.json
      - name: Collect complete original Intent publication inventory
        run: >-
          node .github/scripts/ci-plan.mjs collect vitest.config.ts
          tests/runtime/verification/intent-publication-dependencies.test.ts
          ci-shard-reports/registration ${{ matrix.os }}-node-${{ matrix.node }} ${{ matrix.shard }} 3
      - name: Run the original Intent publication cases on this shard
        # Original known failures remain non-blocking; collection/audit failures do not.
        continue-on-error: true
        timeout-minutes: 15
        run: node .github/scripts/ci-plan.mjs run ci-shard-reports/registration
      - name: Require actual Intent case coverage, preserving original natural skips
        if: always()
        run: node .github/scripts/ci-plan.mjs audit ci-shard-reports/registration
      - name: Preserve Intent shard identities and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registration-cases-${{ matrix.os }}-${{ matrix.node }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: ci-shard-reports/registration/
          if-no-files-found: error
      - name: Preserve actual case identities and failures
        if: always() && matrix.shard == 1
        uses: actions/upload-artifact@v4
        with:
          name: verification-registration-${{ matrix.os }}-node-${{ matrix.node }}-shard-${{ matrix.shard }}-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            verification-registration-source-wholes.json
            verification-registration-intent-publication.json
          if-no-files-found: warn

  publication-coverage:
    needs: registration
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: registration-cases-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-shard-downloads
      - name: Require all original OS/Node case sets
        run: >-
          node .github/scripts/ci-plan.mjs aggregate ci-shard-downloads
          ${{ github.event.pull_request.head.sha || github.sha }}
          ubuntu-latest-node-22.14.0:3,ubuntu-latest-node-24:3,macos-15-node-22.14.0:3,macos-15-node-24:3 3
      - name: Preserve original nine blocking suites and evidence gates
        shell: bash
        env:
          RESULT: ${{ needs.registration.result }}
        run: test "$RESULT" = success
