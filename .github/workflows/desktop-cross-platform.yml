name: Desktop Cross-Platform Tests

# Runs the cross-platform path test suite on real Windows and macOS runners so
# Windows-only path regressions (artifact cards, file:// URLs, basename, path
# escape checks, hardcoded home paths) are caught in CI instead of by users.
#
# Scope covers paths, renderer formatter reuse, Room field classification, and
# the self-contained renderer build. Other suites require sidecar repositories.

on:
  push:
    branches: [master]
    paths:
      - 'desktop/**'
      - 'src/runtime/conversation-activity/**'
      - 'src/runtime/verification/**'
      - 'src/runtime/loop/**'
      - 'src/runtime/isolated-execution/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/support/**'
      - '.github/workflows/desktop-cross-platform.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'src/runtime/conversation-activity/**'
      - 'src/runtime/verification/**'
      - 'src/runtime/loop/**'
      - 'src/runtime/isolated-execution/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/support/**'
      - '.github/workflows/desktop-cross-platform.yml'
  workflow_dispatch: {}

jobs:
  cross-platform-tests:
    name: Desktop path tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install desktop dependencies
        # --ignore-scripts skips the better-sqlite3/electron native postinstall,
        # which is unnecessary for these unit tests + renderer build and whose
        # bash `$(...)` step is fragile under npm's cmd.exe script shell on Windows.
        run: cd desktop && npm ci --ignore-scripts

      - name: Run cross-platform path tests
        run: >
          cd desktop && npm run test -- --run
          tests/renderer/file-path.test.ts
          tests/main/skill-runtime-path-escape.test.ts
          tests/renderer/changed-files-tree-relativize.test.ts
          tests/main/cross-platform-path-guard.test.ts
          tests/renderer/project-artifact-actions.test.tsx
          tests/main/read-file-content-binary.test.ts
          tests/main/file-ipc-schema.test.ts
          tests/main/ipc-handler-test-injection.test.ts
          tests/main/shutdown-aware-ipc-main.test.ts

      - name: Test formatter reuse, Room boundaries and activity retention
        working-directory: desktop
        run: >
          npm test -- --maxWorkers=1
          tests/renderer/intl-formatter-reuse.test.tsx
          tests/renderer/collaboration-rooms-page.test.tsx
          tests/renderer/conversation-activity.test.tsx
          tests/main/room-field-classification.test.ts
          tests/main/conversation-activity-store.test.ts

      - name: Build renderer
        run: cd desktop && npm run build:renderer

  loop-controller-tests:
    name: Loop controller fixtures (${{ matrix.os }}, Node ${{ matrix.node }})
    # Public peer authentication is closed on Windows in controller-ipc.ts.
    # Covers all eight bounded cases, dependency installation and cleanup.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        node: ['22.22.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix desktop
      - name: Test complete signed Loop controller paths and cleanup
        working-directory: desktop
        run: npm test -- --maxWorkers=1 tests/main/loop-verification-execution-controller.test.ts

  loop-controller-macos-diagnostic:
    name: Loop macOS CPU diagnostic (not qualification)
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix desktop
      - name: Profile the original output consumer in its own process group
        shell: bash
        env:
          LOOP_DIAGNOSTIC_DIR: ${{ runner.temp }}/loop-controller-profile
        run: |
          node --input-type=module <<'NODE'
          import {spawn} from 'node:child_process';
          import {mkdirSync,readFileSync,writeFileSync,openSync,closeSync,readdirSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {resolve,join} from 'node:path';
          const root=resolve(process.env.LOOP_DIAGNOSTIC_DIR);
          mkdirSync(root,{mode:0o700});
          const workspace=process.cwd(), hash=path=>createHash('sha256').update(readFileSync(join(workspace,path))).digest('hex');
          const paths=['desktop/tests/main/loop-verification-execution-controller.test.ts','package-lock.json','desktop/package-lock.json','src/runtime/loop/published-candidate.ts'];
          const metadata={diagnosticOnly:true,startedAt:new Date().toISOString(),node:process.version,platform:process.platform,arch:process.arch,checkout:process.env.GITHUB_SHA,sources:Object.fromEntries(paths.map(path=>[path,hash(path)])),caseFilter:'output-consumer$',originalCaseBudgetMs:300000,productReadBudgetMs:10000,profilePerturbsTiming:true};
          const failureCode=error=>error&&typeof error.code==='string'?error.code:'unknown';
          const ioFailure=(operation,error)=>{(metadata.ioFailures??=[]).push({operation,code:failureCode(error)});};
          const safeSave=()=>{try{writeFileSync(join(root,'metadata.json'),JSON.stringify(metadata,null,2)+'\n');return true;}catch(error){ioFailure('metadata',error);return false;}};
          // Finish all potentially throwing setup before assigning a detached child owner.
          if(!safeSave())process.exit(1);
          const logPath=join(root,'test.log'),logFd=openSync(logPath,'wx',0o600);
          const args=['--cpu-prof',`--cpu-prof-dir=${root}`,'node_modules/vitest/vitest.mjs','run','tests/main/loop-verification-execution-controller.test.ts','--maxWorkers=1','--reporter=verbose','-t','output-consumer$'];
          let child;
          try{child=spawn(process.execPath,args,{cwd:join(workspace,'desktop'),detached:true,stdio:['ignore',logFd,logFd]});}
          catch(error){try{closeSync(logFd);}catch(closeError){ioFailure('close-log-fd',closeError);}metadata.spawnError=failureCode(error);safeSave();process.exit(1);}
          try{closeSync(logFd);}catch(error){ioFailure('close-log-fd',error);}
          metadata.pid=child.pid;metadata.pgid=child.pid;metadata.argv=[process.execPath,...args];
          const hasPid=()=>Number.isSafeInteger(child.pid)&&child.pid>0;
          const groupState=()=>{if(!hasPid())return 'not-started';try{process.kill(-child.pid,0);return 'present';}catch(error){return error.code==='ESRCH'?'absent':'unknown';}};
          let killTimer,giveUpTimer,terminationRequested=false,closed=false;
          const unreaped=()=>hasPid()&&child.exitCode===null&&child.signalCode===null;
          const signalOwned=signal=>{if(unreaped()){try{process.kill(-child.pid,signal);metadata[signal==='SIGTERM'?'sentTerm':'sentKill']=true;}catch(error){metadata[signal==='SIGTERM'?'termError':'killError']=failureCode(error);}}};
          const stop=reason=>{
            if(closed||terminationRequested)return;
            terminationRequested=true;metadata.terminationReason=reason;
            if(unreaped())signalOwned('SIGTERM');else metadata.unresolvedGroup=groupState();
            killTimer=setTimeout(()=>{signalOwned('SIGKILL');safeSave();},5000);
            giveUpTimer=setTimeout(()=>{metadata.cleanupUnknown=true;metadata.groupAtGiveUp=groupState();metadata.finishedAt=new Date().toISOString();safeSave();process.exit(1);},10000);
            safeSave();
          };
          const onTerm=()=>stop('owner_SIGTERM'),onInt=()=>stop('owner_SIGINT');
          process.on('SIGTERM',onTerm);process.on('SIGINT',onInt);
          const timer=setTimeout(()=>{metadata.outerTimedOut=true;stop('outer_timeout');},420000);
          child.on('error',error=>{metadata.spawnError=failureCode(error);safeSave();});
          child.on('close',(code,signal)=>{
            closed=true;clearTimeout(timer);clearTimeout(killTimer);clearTimeout(giveUpTimer);
            process.off('SIGTERM',onTerm);process.off('SIGINT',onInt);
            metadata.exitCode=code;metadata.signal=signal;metadata.reaped=true;metadata.finishedAt=new Date().toISOString();metadata.groupAfterClose=groupState();
            metadata.profiles=[];
            try{metadata.profiles=readdirSync(root).filter(name=>name.endsWith('.cpuprofile')).map(name=>{
              const item={name,complete:false,worker:false};
              try{
                const bytes=readFileSync(join(root,name)),profile=JSON.parse(bytes.toString('utf8')),identity=/^CPU\.\d{8}\.\d{6}\.(\d+)\.(\d+)(?:\.(\d+))?\.cpuprofile$/.exec(name);
                const nodes=profile.nodes,samples=profile.samples,deltas=profile.timeDeltas;
                item.sha256=createHash('sha256').update(bytes).digest('hex');item.bytes=bytes.length;
                item.pid=identity?Number(identity[1]):null;item.threadId=identity?Number(identity[2]):null;item.sequence=identity&&identity[3]!==undefined?Number(identity[3]):null;
                if(!Array.isArray(nodes)||!Array.isArray(samples)||!samples.length||!Array.isArray(deltas)||deltas.length!==samples.length||!Number.isFinite(profile.startTime)||!Number.isFinite(profile.endTime)||profile.endTime<=profile.startTime)throw Error('profile_shape');
                const ids=new Set(nodes.map(node=>node.id));
                if(ids.size!==nodes.length||nodes.some(node=>!Number.isSafeInteger(node.id)||!node.callFrame||typeof node.callFrame.url!=='string')||samples.some(id=>!ids.has(id))||deltas.some(delta=>!Number.isFinite(delta)||delta<0))throw Error('profile_samples');
                item.samples=samples.length;item.nodes=nodes.length;item.startTime=profile.startTime;item.endTime=profile.endTime;
                item.hasOriginalTestFrame=nodes.some(node=>node.callFrame.url.includes('/desktop/tests/main/loop-verification-execution-controller.test.ts'));
                item.hasVerificationFrame=nodes.some(node=>node.callFrame.url.includes('/src/runtime/verification/'));
                item.complete=true;item.worker=identity!==null&&Number.isSafeInteger(item.pid)&&item.pid>0&&item.pid!==child.pid&&item.threadId===0&&(item.sequence===null||Number.isSafeInteger(item.sequence))&&item.hasOriginalTestFrame&&item.hasVerificationFrame;
              }catch(error){item.error=error instanceof Error?error.message:'profile_unknown';}
              return item;
            });}catch(error){metadata.profileCollectionError=failureCode(error);}
            metadata.workerProfileConfirmed=metadata.profiles.some(item=>item.complete&&item.worker);
            safeSave();
            // Replay only after child close: diagnostics can no longer orphan an active owner.
            const replayError=error=>{ioFailure('log-replay',error);safeSave();process.exitCode=1;};
            process.stdout.on('error',replayError);
            try{process.stdout.write(readFileSync(logPath));}catch(error){replayError(error);}
            safeSave();
            process.exitCode=!terminationRequested&&!metadata.outerTimedOut&&!metadata.spawnError&&!metadata.ioFailures?.length&&!metadata.profileCollectionError&&code===0&&metadata.groupAfterClose==='absent'&&metadata.workerProfileConfirmed?0:code||1;
          });
          safeSave();
          NODE
      - name: Preserve this job's original diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loop-macos-cpu-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/loop-controller-profile/
          retention-days: 3
          if-no-files-found: warn

  windows-kimi-packaged-smoke:
    name: Windows packaged Kimi K3 smoke
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Compile Windows verification namespace helper
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvarsall.bat" x64
          node scripts/verification/build-windows-absence.mjs --target x64
          node scripts/verification/test-windows-absence.mjs

      - name: Install root dependencies
        run: npm ci

      - name: Install desktop dependencies
        run: cd desktop && npm ci --ignore-scripts

      - name: Clone desktop sidecar repositories
        run: |
          git clone --no-checkout --depth 1 https://github.com/kaisersong/kai-xiaok-plugins.git ../kai-xiaok-plugins
          git -C ../kai-xiaok-plugins fetch --depth 1 origin 56b9df72dfbc4541cab6032d4039e2e208b8be68
          git -C ../kai-xiaok-plugins checkout --detach FETCH_HEAD
          git clone --depth 1 https://github.com/kaisersong/kswarm.git ../kswarm
          git clone --depth 1 https://github.com/kaisersong/intent-broker.git ../intent-broker

      - name: Install sidecar dependencies
        run: |
          cd ../kswarm && npm ci --omit=dev
          cd ../intent-broker && npm ci --omit=dev

      - name: Build report-renderer bundle
        run: |
          cd ../kai-xiaok-plugins/plugins/kai-report-creator/mcp-servers/report-renderer
          npm ci
          npm run build
          npm run build:bundle

      - name: Build canvas frontend and MCP bundle
        run: |
          npm ci --prefix ../kai-xiaok-plugins/plugins/kai-infinity-canvas
          npm run build --prefix ../kai-xiaok-plugins/plugins/kai-infinity-canvas
          npm ci --prefix ../kai-xiaok-plugins/plugins/kai-infinity-canvas/mcp-servers/canvas-server
          npm run build:bundle --prefix ../kai-xiaok-plugins/plugins/kai-infinity-canvas/mcp-servers/canvas-server

      - name: Download Python wheels (Windows)
        shell: pwsh
        run: |
          $wheelDir = Join-Path (Resolve-Path ..\kai-xiaok-plugins\plugins\kai-slide-creator).Path 'bundled-wheels'
          Remove-Item -LiteralPath $wheelDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $wheelDir | Out-Null
          foreach ($py in @('311', '312', '313', '314')) {
            python -m pip download mcp==2.3.0 pydantic==2.13.4 jsonschema==4.26.0 beautifulsoup4 `
              -d $wheelDir `
              --only-binary=:all: `
              --platform win_amd64 `
              --implementation cp `
              --python-version $py `
              --abi "cp$py" `
              --abi abi3 `
              --abi none
          }

      - name: Vendor self-contained provider runtimes (Windows)
        shell: bash
        run: |
          cd ../kai-xiaok-plugins
          node scripts/vendor-runtimes.mjs --runtime slide-python --target win32-x64
          node scripts/vendor-runtimes.mjs --runtime slide-python --target win32-x64 --verify

      - name: Prepare verified artifact export helper
        env:
          XIAOK_EXPORT_PACKAGE_INTEGRATION: '1'
        run: |
          node scripts/verification/prepare-artifact-export-toolchain.mjs
          node scripts/verification/build-artifact-export-helper.mjs --target win32-x64
          cd desktop && npm run test -- --run tests/main/artifact-export-package.test.ts

      - name: Build desktop
        run: cd desktop && npm run build
        env:
          KSWARM_SOURCE_ROOT: ${{ github.workspace }}/../kswarm

      - name: Package Windows Kimi smoke app
        shell: bash
        run: cd desktop && npx electron-builder --config electron-builder.json --win dir --publish never -c.win.signAndEditExecutable=false

      - name: Run packaged Windows Kimi K3 smoke
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP 'xiaok-kimi-packaged-smoke'
          $resultPath = Join-Path $smokeRoot 'result.json'
          $appData = Join-Path $smokeRoot 'appdata'
          $localAppData = Join-Path $smokeRoot 'localappdata'
          $tempDir = Join-Path $smokeRoot 'temp'
          New-Item -ItemType Directory -Force -Path $appData, $localAppData, $tempDir | Out-Null

          $env:XIAOK_KIMI_PACKAGED_SMOKE_RESULT = $resultPath
          $env:XIAOK_DESKTOP_DISABLE_SINGLE_INSTANCE = '1'
          $env:APPDATA = $appData
          $env:LOCALAPPDATA = $localAppData
          $env:TEMP = $tempDir
          $env:TMP = $tempDir

          $executable = Resolve-Path 'desktop/release/win-unpacked/xiaok.exe'
          $process = Start-Process -FilePath $executable -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "Packaged Kimi smoke exited with code $($process.ExitCode)"
          }
          if (-not (Test-Path -LiteralPath $resultPath)) {
            throw 'Packaged Kimi smoke did not write its result'
          }
          $result = Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json
          if ($result.status -ne 'pass' -or $result.modelResults.Count -ne 2) {
            throw 'Packaged Kimi smoke result is incomplete'
          }
          foreach ($model in @('k3', 'k3-256k')) {
            $entry = $result.modelResults | Where-Object { $_.model -eq $model }
            if (-not $entry -or $entry.requests -ne 2 -or -not $entry.secondTurnReplayedReasoning) {
              throw "Packaged Kimi multi-turn smoke failed for $model"
            }
          }
          if ($result.authorizationDenyNetworkRequests -ne 0 -or $result.rollbackDenyNetworkRequests -ne 0) {
            throw 'Packaged Kimi deny smoke observed a network request'
          }
          $canaryHit = Get-ChildItem -LiteralPath $smokeRoot -Recurse -File |
            Where-Object { $_.FullName -ne $resultPath } |
            Select-String -SimpleMatch 'PACKAGED_SMOKE_RUNTIME_ONLY' -List
          if ($canaryHit) {
            throw "Provider-private reasoning canary persisted at $($canaryHit.Path)"
          }
