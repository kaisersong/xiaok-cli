name: Desktop Cross-Platform Tests

# Runs the cross-platform path test suite on real Windows and macOS runners so
# Windows-only path regressions (artifact cards, file:// URLs, basename, path
# escape checks, hardcoded home paths) are caught in CI instead of by users.
#
# Scope is intentionally focused: it runs the path-related test files plus the
# self-contained renderer build. It does NOT run the full desktop suite, which
# needs the sidecar repos and has unrelated Windows temp-dir teardown flakiness.

on:
  push:
    branches: [master]
    paths:
      - 'desktop/**'
      - 'src/runtime/bundled-yzj-cli.ts'
      - 'src/runtime/enterprise-cli-*.ts'
      - 'data/skills/dingtalk-cli/**'
      - 'data/skills/feishu-cli/**'
      - 'data/skills/wecom-cli/**'
      - 'src/commands/yzj-cli.ts'
      - 'src/ai/skills/defaults.ts'
      - 'data/yzj-cli/**'
      - 'data/skills/yzj-cli/**'
      - 'tests/runtime/*yzj-cli*.test.ts'
      - 'tests/commands/yzj-cli.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'src/ai/runtime/**'
      - 'src/runtime/task-host/**'
      - 'src/ai/adapters/**'
      - 'src/ai/providers/kimi-models.ts'
      - 'src/ai/memory/segment.ts'
      - 'src/ai/memory/layered-store.ts'
      - 'src/platform/mcp/python-server.ts'
      - 'tests/platform/mcp/python-server.test.ts'
      - 'scripts/read-kimi-coding-models.mjs'
      - 'scripts/verify-packaged-kimi-smoke-result.mjs'
      - 'scripts/check-desktop-sibling-pins.mjs'
      - 'src/ai/runtime/**'
      - '.github/workflows/desktop-cross-platform.yml'
      - '.github/workflows/desktop-release.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'src/runtime/bundled-yzj-cli.ts'
      - 'src/runtime/enterprise-cli-*.ts'
      - 'data/skills/dingtalk-cli/**'
      - 'data/skills/feishu-cli/**'
      - 'data/skills/wecom-cli/**'
      - 'src/commands/yzj-cli.ts'
      - 'src/ai/skills/defaults.ts'
      - 'data/yzj-cli/**'
      - 'data/skills/yzj-cli/**'
      - 'tests/runtime/*yzj-cli*.test.ts'
      - 'tests/commands/yzj-cli.test.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'src/ai/runtime/**'
      - 'src/runtime/task-host/**'
      - 'src/ai/adapters/**'
      - 'src/ai/providers/kimi-models.ts'
      - 'src/ai/memory/segment.ts'
      - 'src/ai/memory/layered-store.ts'
      - 'src/platform/mcp/python-server.ts'
      - 'tests/platform/mcp/python-server.test.ts'
      - 'scripts/read-kimi-coding-models.mjs'
      - 'scripts/verify-packaged-kimi-smoke-result.mjs'
      - 'scripts/check-desktop-sibling-pins.mjs'
      - 'src/ai/runtime/**'
      - '.github/workflows/desktop-cross-platform.yml'
      - '.github/workflows/desktop-release.yml'
  workflow_dispatch: {}

jobs:
  sibling-pin-consistency:
    name: Desktop sibling pin consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail when cross-platform and release sibling pins drift
        run: node scripts/check-desktop-sibling-pins.mjs

  detect-packaged-kimi-smoke:
    name: Detect packaged Kimi smoke paths
    runs-on: ubuntu-latest
    outputs:
      run_smoke: ${{ steps.detect.outputs.run_smoke }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run_smoke=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
            if [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]]; then
              BASE="$(git rev-parse "$HEAD^")"
            fi
          fi
          PATTERN='^(src/ai/providers/kimi-models\.ts|src/ai/memory/segment\.ts|src/ai/memory/layered-store\.ts|desktop/electron-builder\.json|desktop/package(-lock)?\.json|desktop/electron/kimi-packaged-smoke\.ts|desktop/electron/packaged-segmentation-smoke\.ts|scripts/read-kimi-coding-models\.mjs|scripts/verify-packaged-kimi-smoke-result\.mjs|\.github/workflows/desktop-(cross-platform|release)\.yml)$'
          # Fail-closed: if git diff cannot run (bad/missing objects), force smoke on.
          # Previously a failed diff landed in the else branch → run_smoke=false (M1).
          if ! DIFF_OUT="$(git diff --name-only "$BASE" "$HEAD" 2>/tmp/packaged-kimi-diff.err)"; then
            echo "git diff failed for $BASE..$HEAD; fail-closed → run_smoke=true" >&2
            cat /tmp/packaged-kimi-diff.err >&2 || true
            echo "run_smoke=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$DIFF_OUT" | grep -E "$PATTERN"; then
            echo "run_smoke=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_smoke=false" >> "$GITHUB_OUTPUT"
          fi

  cross-platform-tests:
    name: Desktop path tests (${{ matrix.os }})
    needs: [sibling-pin-consistency]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Prepare node-gyp headers (retrying download, cached)
        uses: ./.github/actions/node-headers

      - name: Install root dependencies
        shell: bash
        run: bash .github/scripts/retry.sh npm ci

      - name: Install desktop dependencies
        # --ignore-scripts skips the better-sqlite3/electron native postinstall,
        # which is unnecessary for these unit tests + renderer build and whose
        # bash `$(...)` step is fragile under npm's cmd.exe script shell on Windows.
        shell: bash
        run: cd desktop && bash ../.github/scripts/retry.sh npm ci --ignore-scripts

      - name: Run cross-platform path tests
        run: >
          cd desktop && npm run test -- --run
          tests/renderer/file-path.test.ts
          tests/renderer/chat-input-clipboard.test.tsx
          tests/main/clipboard-file-paths.test.ts
          tests/main/skill-runtime-path-escape.test.ts
          tests/renderer/changed-files-tree-relativize.test.ts
          tests/main/cross-platform-path-guard.test.ts
          tests/main/bundled-yzj-cli-package.test.ts
          tests/main/bundled-yzj-cli-runtime.test.ts
          tests/main/bundled-yzj-cli-command.test.ts
          tests/main/enterprise-cli-runtime.test.ts
          tests/main/enterprise-cli-service.test.ts
          tests/main/enterprise-cli-ipc.test.ts
          tests/renderer/enterprise-cli-connectors.test.tsx
          tests/main/yzj-cli-auth-service.test.ts
          tests/main/yzj-cli-auth-ipc.test.ts
          tests/renderer/yzj-cli-auth-card.test.tsx
          tests/renderer/project-artifact-actions.test.tsx
          tests/main/read-file-content-binary.test.ts
          tests/main/file-ipc-schema.test.ts
          tests/main/ipc-handler-test-injection.test.ts
          tests/main/shutdown-aware-ipc-main.test.ts
          tests/main/desktop-text-repetition.test.ts
          tests/renderer/chat-shell-repetition.test.tsx
          tests/renderer/chat-shell-repetition-structured.test.tsx
          tests/renderer/chat-shell-repetition-history.test.tsx
          tests/main/desktop-task-stream-recovery.test.ts
          tests/main/kimi-packaged-smoke.test.ts
          tests/main/desktop-memory-store-close.test.ts
          tests/main/packaged-segmentation-smoke.test.ts
          tests/main/windows-kimi-packaged-smoke-contract.test.ts
          tests/main/kimi-harness-contract.test.ts
          tests/main/kimi-reasoning-admission.test.ts
          tests/main/desktop-provider-stream-lifecycle.test.ts
          tests/main/desktop-startup-task-recovery.test.ts
          tests/main/desktop-tool-execution-policy.test.ts
          tests/main/desktop-multi-agent-catalog-bridge.bdd.test.ts
          tests/main/desktop-multi-agent-capabilities.bdd.test.ts
          tests/main/desktop-protection-ordinary-read.test.ts
          tests/main/desktop-protection-worker-compiled-entry.test.ts
          tests/main/project-stream-reconnect-regression.test.ts
          tests/renderer/chat-helpers-error-sanitization.test.ts
          tests/renderer/chat-shell-draft-prompt.test.tsx
          tests/main/conversation-activity-ipc.test.ts
          tests/main/artifact-export-package.test.ts
          tests/main/scheduled-task-delivery.test.ts
          tests/renderer/scheduled-task-delivery.test.tsx
          tests/main/scheduled-preload.test.ts
          tests/main/remote-debugging.test.ts
          tests/main/room-scheduled-context.test.ts
          tests/renderer/scheduled-sidebar-selection.test.tsx
          tests/renderer/chat-approval-scroll.test.tsx
          tests/renderer/channel-mcp-mutation-ui.test.tsx
          tests/renderer/channel-mcp-mutation-ui-followup.test.tsx

      - name: Desktop services and model recommendation tests
        run: >-
          cd desktop && npm run test -- --run
          tests/main/desktop-services-pure-node-import.test.ts
          tests/main/desktop-services-scheduled-task-authority.test.ts
          tests/renderer/model-recommendations.test.ts
          tests/main/desktop-services-model-catalog.test.ts

      - name: Desktop services and model recommendation tests
        run: >-
          cd desktop && npm run test -- --run
          tests/main/desktop-services-pure-node-import.test.ts
          tests/main/desktop-services-scheduled-task-authority.test.ts
          tests/renderer/model-recommendations.test.ts
          tests/main/desktop-services-model-catalog.test.ts

      - name: Activity owner handoff regression (macOS)
        if: runner.os == 'macOS'
        run: cd desktop && npm run test -- --run tests/main/activity-owner-attach-retry.test.ts

      - name: Build renderer
        run: cd desktop && npm run build:renderer

      - name: Managed Python runtime regression
        run: cd desktop && npm run test -- --run tests/main/python-runtime.test.ts tests/main/deploy-bundled-plugins.test.ts

      - name: Managed Python CLI resolver regression
        run: node node_modules/vitest/vitest.mjs run tests/platform/mcp/python-server.test.ts --config vitest.config.ts

      - name: Model catalog and selector regression
        run: node node_modules/vitest/vitest.mjs run tests/ai/adapters/gemini-thought-signature.test.ts tests/ai/providers/current-year-catalog.test.ts tests/ai/providers/kimi-k28.test.ts --config vitest.config.ts

  windows-kimi-packaged-smoke:
    name: Windows packaged Kimi K3 smoke
    needs: [sibling-pin-consistency, detect-packaged-kimi-smoke]
    if: needs.detect-packaged-kimi-smoke.outputs.run_smoke == 'true'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Prepare node-gyp headers (retrying download, cached)
        uses: ./.github/actions/node-headers

      - name: Compile Windows verification namespace helper
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvarsall.bat" x64
          node scripts/verification/build-windows-absence.mjs --target x64
          node scripts/verification/test-windows-absence.mjs

      - name: Install root dependencies
        shell: bash
        run: bash .github/scripts/retry.sh npm ci

      - name: Install desktop dependencies
        shell: bash
        run: cd desktop && bash ../.github/scripts/retry.sh npm ci --ignore-scripts

      - name: Build nodejieba native binding for packaged segmentation (#150 M6)
        # npm ci --ignore-scripts skips nodejieba's node-pre-gyp install, so the
        # packaged app would ship without build/Release/nodejieba.node and the
        # packaged segmentation smoke step fails closed. N-API binding: a Node
        # build loads under Electron (electron-builder npmRebuild=false).
        shell: bash
        run: |
          cd desktop
          bash ../.github/scripts/retry.sh npm rebuild nodejieba
          node -e "const j=require('nodejieba');const o=j.cut('南京市长江大桥').join(' ');console.log(require.resolve('nodejieba'),o);if(o!=='南京市 长江大桥')process.exit(1)"

      - name: Clone desktop sidecar repositories
        run: |
          git clone --no-checkout --depth 1 https://github.com/kaisersong/kai-xiaok-plugins.git ../kai-xiaok-plugins
          git -C ../kai-xiaok-plugins fetch --depth 1 origin 828c4c11122fcbbb50837c34aaac3b98a9f79404
          git -C ../kai-xiaok-plugins checkout --detach FETCH_HEAD
          git clone --no-checkout --depth 1 https://github.com/kaisersong/kswarm.git ../kswarm
          git -C ../kswarm fetch --depth 1 origin 16c3ed14c5493a82d000d69d34e4b1c933187433
          git -C ../kswarm checkout --detach FETCH_HEAD
          git clone --no-checkout --depth 1 https://github.com/kaisersong/intent-broker.git ../intent-broker
          git -C ../intent-broker fetch --depth 1 origin 2dd1f40dc5e0fc5438a2086d13963cc67489db45
          git -C ../intent-broker checkout --detach FETCH_HEAD

      - name: Install sidecar dependencies
        shell: bash
        run: |
          retry="$PWD/.github/scripts/retry.sh"
          cd ../kswarm && bash "$retry" npm ci --omit=dev
          cd ../intent-broker && bash "$retry" npm ci --omit=dev

      - name: Build report-renderer bundle
        shell: bash
        run: |
          retry="$PWD/.github/scripts/retry.sh"
          cd ../kai-xiaok-plugins/plugins/kai-report-creator/mcp-servers/report-renderer
          bash "$retry" npm ci
          npm run build
          npm run build:bundle

      - name: Build canvas frontend and MCP bundle
        shell: bash
        run: |
          retry="$PWD/.github/scripts/retry.sh"
          bash "$retry" npm ci --prefix ../kai-xiaok-plugins/plugins/kai-infinity-canvas
          npm run build --prefix ../kai-xiaok-plugins/plugins/kai-infinity-canvas
          bash "$retry" npm ci --prefix ../kai-xiaok-plugins/plugins/kai-infinity-canvas/mcp-servers/canvas-server
          npm run build:bundle --prefix ../kai-xiaok-plugins/plugins/kai-infinity-canvas/mcp-servers/canvas-server

      - name: Download Python wheels (Windows)
        shell: pwsh
        run: |
          $wheelDir = Join-Path (Resolve-Path ..\kai-xiaok-plugins\plugins\kai-slide-creator).Path 'bundled-wheels'
          Remove-Item -LiteralPath $wheelDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $wheelDir | Out-Null
          foreach ($py in @('311', '312', '313', '314')) {
            python -m pip download mcp==2.3.0 pydantic==2.13.4 jsonschema==4.26.0 beautifulsoup4 `
              -d $wheelDir `
              --only-binary=:all: `
              --platform win_amd64 `
              --implementation cp `
              --python-version $py `
              --abi "cp$py" `
              --abi abi3 `
              --abi none
          }

      - name: Vendor self-contained provider runtimes (Windows)
        run: |
          cd ../kai-xiaok-plugins
          node scripts/vendor-runtimes.mjs --runtime slide-python --target win32-x64
          node scripts/vendor-runtimes.mjs --runtime slide-python --target win32-x64 --verify

      - name: Prepare verified artifact export helper
        env:
          XIAOK_EXPORT_PACKAGE_INTEGRATION: '1'
        run: |
          node scripts/verification/prepare-artifact-export-toolchain.mjs
          node scripts/verification/build-artifact-export-helper.mjs --target win32-x64
          cd desktop && npm run test -- --run tests/main/artifact-export-package.test.ts

      - name: Build desktop
        run: cd desktop && npm run build
        env:
          KSWARM_SOURCE_ROOT: ${{ github.workspace }}/../kswarm

      - name: Package Windows Kimi smoke app
        shell: bash
        run: cd desktop && npx electron-builder --config electron-builder.json --win dir --publish never -c.win.signAndEditExecutable=false

      - name: Run packaged Windows Kimi K3 smoke
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP 'xiaok-kimi-packaged-smoke'
          $resultPath = Join-Path $smokeRoot 'result.json'
          $appData = Join-Path $smokeRoot 'appdata'
          $localAppData = Join-Path $smokeRoot 'localappdata'
          $tempDir = Join-Path $smokeRoot 'temp'
          New-Item -ItemType Directory -Force -Path $appData, $localAppData, $tempDir | Out-Null

          $env:XIAOK_KIMI_PACKAGED_SMOKE_RESULT = $resultPath
          $env:XIAOK_DESKTOP_DISABLE_SINGLE_INSTANCE = '1'
          $env:APPDATA = $appData
          $env:LOCALAPPDATA = $localAppData
          $env:TEMP = $tempDir
          $env:TMP = $tempDir

          $executable = Resolve-Path 'desktop/release/win-unpacked/xiaok.exe'
          $process = Start-Process -FilePath $executable -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "Packaged Kimi smoke exited with code $($process.ExitCode)"
          }
          if (-not (Test-Path -LiteralPath $resultPath)) {
            throw 'Packaged Kimi smoke did not write its result'
          }
          node scripts/verify-packaged-kimi-smoke-result.mjs $resultPath $smokeRoot

      # Upload the exact packaged app that just passed the smoke (incl. the
      # segmentation assertion), so it can be re-tested on a real Windows machine
      # (#150 M6). Runs only after the smoke step succeeded.
      - name: Upload smoke-verified Windows package
        uses: actions/upload-artifact@v4
        with:
          name: xiaok-win-unpacked-${{ github.sha }}
          path: desktop/release/win-unpacked
          if-no-files-found: error
          retention-days: 7
