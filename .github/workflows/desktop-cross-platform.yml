name: Desktop Cross-Platform Tests

# Runs the cross-platform path test suite on real Windows and macOS runners so
# Windows-only path regressions (artifact cards, file:// URLs, basename, path
# escape checks, hardcoded home paths) are caught in CI instead of by users.
#
# Scope covers paths, renderer formatter reuse, Room field classification, and
# the self-contained renderer build. Other suites require sidecar repositories.

on:
  push:
    branches: [master]
    paths:
      - 'desktop/**'
      - 'src/runtime/conversation-activity/**'
      - 'src/runtime/verification/**'
      - 'src/runtime/loop/**'
      - 'src/runtime/isolated-execution/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/support/**'
      - '.github/workflows/desktop-cross-platform.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'src/runtime/conversation-activity/**'
      - 'src/runtime/verification/**'
      - 'src/runtime/loop/**'
      - 'src/runtime/isolated-execution/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/support/**'
      - '.github/workflows/desktop-cross-platform.yml'
  workflow_dispatch: {}

jobs:
  cross-platform-tests:
    name: Desktop path tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install desktop dependencies
        # --ignore-scripts skips the better-sqlite3/electron native postinstall,
        # which is unnecessary for these unit tests + renderer build and whose
        # bash `$(...)` step is fragile under npm's cmd.exe script shell on Windows.
        run: cd desktop && npm ci --ignore-scripts

      - name: Run cross-platform path tests
        run: >
          cd desktop && npm run test -- --run
          tests/renderer/file-path.test.ts
          tests/main/skill-runtime-path-escape.test.ts
          tests/renderer/changed-files-tree-relativize.test.ts
          tests/main/cross-platform-path-guard.test.ts
          tests/renderer/project-artifact-actions.test.tsx
          tests/main/read-file-content-binary.test.ts
          tests/main/file-ipc-schema.test.ts
          tests/main/ipc-handler-test-injection.test.ts
          tests/main/shutdown-aware-ipc-main.test.ts

      - name: Test formatter reuse, Room boundaries and activity retention
        working-directory: desktop
        run: >
          npm test -- --maxWorkers=1
          tests/renderer/intl-formatter-reuse.test.tsx
          tests/renderer/collaboration-rooms-page.test.tsx
          tests/renderer/conversation-activity.test.tsx
          tests/main/room-field-classification.test.ts
          tests/main/conversation-activity-store.test.ts

      - name: Build renderer
        run: cd desktop && npm run build:renderer

  loop-controller-tests:
    name: Loop controller fixtures (${{ matrix.os }}, Node ${{ matrix.node }})
    # Public peer authentication is closed on Windows in controller-ipc.ts.
    # Covers all eight bounded cases, dependency installation and cleanup.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        node: ['22.22.0', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix desktop
      - name: Verify temporary Loop diagnostic guards
        run: node --test tests/support/loop-read-error-diagnostic.test.mjs tests/support/loop-read-error-diagnostic-schema.test.mjs tests/support/loop-read-error-diagnostic-gate.test.mjs tests/support/loop-read-error-diagnostic-observation.test.mjs
      - name: Test complete signed Loop controller paths and cleanup with temporary diagnostic
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        working-directory: desktop
        env:
          XIAOK_LOOP_READ_ERROR_DIAGNOSTIC: '1'
        run: |
          node ../tests/support/loop-read-error-diagnostic-attempt.mjs
          npm test -- --maxWorkers=1 tests/main/loop-verification-execution-controller.test.ts
      - name: Test complete signed Loop controller paths and cleanup with diagnostic off
        if: github.event_name == 'workflow_dispatch'
        working-directory: desktop
        run: npm test -- --maxWorkers=1 tests/main/loop-verification-execution-controller.test.ts

  windows-kimi-packaged-smoke:
    name: Windows packaged Kimi K3 smoke
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Compile Windows verification namespace helper
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvarsall.bat" x64
          node scripts/verification/build-windows-absence.mjs --target x64
          node scripts/verification/test-windows-absence.mjs

      - name: Install root dependencies
        run: npm ci

      - name: Install desktop dependencies
        run: cd desktop && npm ci --ignore-scripts

      - name: Clone desktop sidecar repositories
        run: |
          git clone --no-checkout --depth 1 https://github.com/kaisersong/kai-xiaok-plugins.git ../kai-xiaok-plugins
          git -C ../kai-xiaok-plugins fetch --depth 1 origin 56b9df72dfbc4541cab6032d4039e2e208b8be68
          git -C ../kai-xiaok-plugins checkout --detach FETCH_HEAD
          git clone --depth 1 https://github.com/kaisersong/kswarm.git ../kswarm
          git clone --depth 1 https://github.com/kaisersong/intent-broker.git ../intent-broker

      - name: Install sidecar dependencies
        run: |
          cd ../kswarm && npm ci --omit=dev
          cd ../intent-broker && npm ci --omit=dev

      - name: Build report-renderer bundle
        run: |
          cd ../kai-xiaok-plugins/plugins/kai-report-creator/mcp-servers/report-renderer
          npm ci
          npm run build
          npm run build:bundle

      - name: Build canvas frontend and MCP bundle
        run: |
          npm ci --prefix ../kai-xiaok-plugins/plugins/kai-infinity-canvas
          npm run build --prefix ../kai-xiaok-plugins/plugins/kai-infinity-canvas
          npm ci --prefix ../kai-xiaok-plugins/plugins/kai-infinity-canvas/mcp-servers/canvas-server
          npm run build:bundle --prefix ../kai-xiaok-plugins/plugins/kai-infinity-canvas/mcp-servers/canvas-server

      - name: Download Python wheels (Windows)
        shell: pwsh
        run: |
          $wheelDir = Join-Path (Resolve-Path ..\kai-xiaok-plugins\plugins\kai-slide-creator).Path 'bundled-wheels'
          Remove-Item -LiteralPath $wheelDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $wheelDir | Out-Null
          foreach ($py in @('311', '312', '313', '314')) {
            python -m pip download mcp==2.3.0 pydantic==2.13.4 jsonschema==4.26.0 beautifulsoup4 `
              -d $wheelDir `
              --only-binary=:all: `
              --platform win_amd64 `
              --implementation cp `
              --python-version $py `
              --abi "cp$py" `
              --abi abi3 `
              --abi none
          }

      - name: Vendor self-contained provider runtimes (Windows)
        shell: bash
        run: |
          cd ../kai-xiaok-plugins
          node scripts/vendor-runtimes.mjs --runtime slide-python --target win32-x64
          node scripts/vendor-runtimes.mjs --runtime slide-python --target win32-x64 --verify

      - name: Prepare verified artifact export helper
        env:
          XIAOK_EXPORT_PACKAGE_INTEGRATION: '1'
        run: |
          node scripts/verification/prepare-artifact-export-toolchain.mjs
          node scripts/verification/build-artifact-export-helper.mjs --target win32-x64
          cd desktop && npm run test -- --run tests/main/artifact-export-package.test.ts

      - name: Build desktop
        run: cd desktop && npm run build
        env:
          KSWARM_SOURCE_ROOT: ${{ github.workspace }}/../kswarm

      - name: Package Windows Kimi smoke app
        shell: bash
        run: cd desktop && npx electron-builder --config electron-builder.json --win dir --publish never -c.win.signAndEditExecutable=false

      - name: Run packaged Windows Kimi K3 smoke
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP 'xiaok-kimi-packaged-smoke'
          $resultPath = Join-Path $smokeRoot 'result.json'
          $appData = Join-Path $smokeRoot 'appdata'
          $localAppData = Join-Path $smokeRoot 'localappdata'
          $tempDir = Join-Path $smokeRoot 'temp'
          New-Item -ItemType Directory -Force -Path $appData, $localAppData, $tempDir | Out-Null

          $env:XIAOK_KIMI_PACKAGED_SMOKE_RESULT = $resultPath
          $env:XIAOK_DESKTOP_DISABLE_SINGLE_INSTANCE = '1'
          $env:APPDATA = $appData
          $env:LOCALAPPDATA = $localAppData
          $env:TEMP = $tempDir
          $env:TMP = $tempDir

          $executable = Resolve-Path 'desktop/release/win-unpacked/xiaok.exe'
          $process = Start-Process -FilePath $executable -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "Packaged Kimi smoke exited with code $($process.ExitCode)"
          }
          if (-not (Test-Path -LiteralPath $resultPath)) {
            throw 'Packaged Kimi smoke did not write its result'
          }
          $result = Get-Content -LiteralPath $resultPath -Raw | ConvertFrom-Json
          if ($result.status -ne 'pass' -or $result.modelResults.Count -ne 2) {
            throw 'Packaged Kimi smoke result is incomplete'
          }
          foreach ($model in @('k3', 'k3-256k')) {
            $entry = $result.modelResults | Where-Object { $_.model -eq $model }
            if (-not $entry -or $entry.requests -ne 2 -or -not $entry.secondTurnReplayedReasoning) {
              throw "Packaged Kimi multi-turn smoke failed for $model"
            }
          }
          if ($result.authorizationDenyNetworkRequests -ne 0 -or $result.rollbackDenyNetworkRequests -ne 0) {
            throw 'Packaged Kimi deny smoke observed a network request'
          }
          $canaryHit = Get-ChildItem -LiteralPath $smokeRoot -Recurse -File |
            Where-Object { $_.FullName -ne $resultPath } |
            Select-String -SimpleMatch 'PACKAGED_SMOKE_RUNTIME_ONLY' -List
          if ($canaryHit) {
            throw "Provider-private reasoning canary persisted at $($canaryHit.Path)"
          }
