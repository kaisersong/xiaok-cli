name: Windows ordinary-session native helper
on:
  workflow_dispatch:
  push:
    paths:
      - src/runtime/verification/native/windows-installation-absence*
      - scripts/verification/*windows-absence.mjs
      - .github/workflows/windows-absence.yml
  pull_request:
    paths:
      - src/runtime/verification/native/windows-installation-absence*
      - scripts/verification/*windows-absence.mjs
      - .github/workflows/windows-absence.yml
jobs:
  native-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compile with the actual Windows SDK
        # Batch, not PowerShell: the vcvarsall call needs cmd quoting, and building
        # it as a PowerShell string breaks under pwsh 7, whose native argument
        # passing re-escapes the quotes.
        shell: cmd
        run: |
          for /f "usebackq tokens=* delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL (
            echo Windows C compiler missing
            exit /b 1
          )
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvarsall.bat" x64 >nul
          if errorlevel 1 (
            echo Windows C SDK activation failed
            exit /b 1
          )
          node scripts\verification\build-windows-absence.mjs --target x64
          if errorlevel 1 (
            echo Native compilation failed
            exit /b 1
          )
      - name: Run fixed machine absence checks
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'data/verification/windows/win32-x64/windows-installation-absence.exe'
          $answer = (& $exe | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0 -or $answer.kind -ne 'ordinary') { throw 'Clean runner absence check failed' }
          $env:ProgramData = Join-Path $env:RUNNER_TEMP 'spoofed-programdata'
          $answer = (& $exe | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0 -or $answer.kind -ne 'ordinary') { throw 'Environment affected the fixed lookup' }
          $answer = (& $exe ignored | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 2 -or $answer.kind -ne 'unavailable') { throw 'Argument override accepted' }
          $global:LASTEXITCODE = 0
      - uses: actions/upload-artifact@v4
        with:
          name: windows-absence-x64
          path: data/verification/windows/win32-x64/windows-installation-absence.*
  native-arm64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Cross-compile for ARM64 with the actual Windows SDK
        # amd64_arm64 targets ARM64 from this x64 runner. Per the design doc this
        # job counts as cross-compilation only: the produced binary is never
        # executed here, so nothing here claims real-machine ARM64 behaviour.
        shell: cmd
        run: |
          for /f "usebackq tokens=* delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL (
            echo Windows ARM64 C compiler missing
            exit /b 1
          )
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvarsall.bat" amd64_arm64 >nul
          if errorlevel 1 (
            echo Windows ARM64 C SDK activation failed
            exit /b 1
          )
          node scripts\verification\build-windows-absence.mjs --target arm64
          if errorlevel 1 (
            echo ARM64 cross compilation failed
            exit /b 1
          )
      - uses: actions/upload-artifact@v4
        with:
          name: windows-absence-arm64
          path: data/verification/windows/win32-arm64/windows-installation-absence.*
