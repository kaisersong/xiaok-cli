name: Windows ordinary-session native helper
on:
  workflow_dispatch:
  push:
    paths:
      - src/runtime/verification/windows-installation-absence.ts
      - src/runtime/verification/native/windows-installation-absence*
      - data/verification/windows/**
      - scripts/verification/*windows-absence.mjs
      - tests/scripts/windows-absence*.test.mjs
      - .github/workflows/windows-absence.yml
  pull_request:
    paths:
      - src/runtime/verification/windows-installation-absence.ts
      - src/runtime/verification/native/windows-installation-absence*
      - data/verification/windows/**
      - scripts/verification/*windows-absence.mjs
      - tests/scripts/windows-absence*.test.mjs
      - .github/workflows/windows-absence.yml
jobs:
  native-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Compile with the actual Windows SDK
        # Batch, not PowerShell: the vcvarsall call needs cmd quoting, and building
        # it as a PowerShell string breaks under pwsh 7, whose native argument
        # passing re-escapes the quotes.
        shell: cmd
        run: |
          for /f "usebackq tokens=* delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL (
            echo Windows C compiler missing
            exit /b 1
          )
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvarsall.bat" x64 >nul
          if errorlevel 1 (
            echo Windows C SDK activation failed
            exit /b 1
          )
          node scripts\verification\build-windows-absence.mjs --target x64
          if errorlevel 1 (
            echo Native compilation failed
            exit /b 1
          )
      - name: Run fixed machine absence checks
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'data/verification/windows/win32-x64/windows-installation-absence.exe'
          $answer = (& $exe | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0 -or $answer.kind -ne 'ordinary') { throw 'Clean runner absence check failed' }
          $env:ProgramData = Join-Path $env:RUNNER_TEMP 'spoofed-programdata'
          $answer = (& $exe | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 0 -or $answer.kind -ne 'ordinary') { throw 'Environment affected the fixed lookup' }
          $answer = (& $exe ignored | ConvertFrom-Json)
          if ($LASTEXITCODE -ne 2 -or $answer.kind -ne 'unavailable') { throw 'Argument override accepted' }
          $global:LASTEXITCODE = 0
      - uses: actions/upload-artifact@v4
        with:
          name: windows-absence-x64
          path: data/verification/windows/win32-x64/windows-installation-absence.*
  native-arm64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Cross-compile for ARM64 with the actual Windows SDK
        # amd64_arm64 targets ARM64 from this x64 runner. Per the design doc this
        # job counts as cross-compilation only: the produced binary is never
        # executed here, so nothing here claims real-machine ARM64 behaviour.
        shell: cmd
        run: |
          for /f "usebackq tokens=* delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL (
            echo Windows ARM64 C compiler missing
            exit /b 1
          )
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvarsall.bat" amd64_arm64 >nul
          if errorlevel 1 (
            echo Windows ARM64 C SDK activation failed
            exit /b 1
          )
          node scripts\verification\build-windows-absence.mjs --target arm64
          if errorlevel 1 (
            echo ARM64 cross compilation failed
            exit /b 1
          )
      - uses: actions/upload-artifact@v4
        with:
          name: windows-absence-arm64
          path: data/verification/windows/win32-arm64/windows-installation-absence.*
  packaging-gate:
    # The prepack hook in package.json refuses to package a reader without a
    # native payload for every architecture it ships, and the design doc requires
    # a general CLI release to carry both. Nothing used to run that hook in CI, so
    # it stayed a silent no-op while the reader had no source at all.
    # This job stages the payloads the two jobs above actually produced, runs the
    # hook exactly as npm does with no --arch override, and on master commits the
    # payloads back so a clean checkout can package.
    needs: [native-x64, native-arm64]
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          pattern: windows-absence-*
          path: ${{ runner.temp }}/absence-payloads
      - name: Stage the produced payloads where the hook reads them
        shell: pwsh
        run: |
          foreach ($arch in 'x64','arm64') {
            $from = Join-Path "${{ runner.temp }}/absence-payloads" "windows-absence-$arch"
            $to = Join-Path $PWD "data/verification/windows/win32-$arch"
            New-Item -ItemType Directory -Force -Path $to | Out-Null
            Copy-Item (Join-Path $from 'windows-installation-absence.*') $to -Force
          }
      - name: Run the packaging hook exactly as npm run prepack does
        shell: cmd
        run: |
          node scripts\verification\copy-windows-absence.mjs
          if errorlevel 1 (
            echo The prepack hook rejected the produced artifacts
            exit /b 1
          )
      - name: Assert both native payloads reached dist
        shell: pwsh
        run: |
          $missing = @()
          foreach ($arch in 'x64','arm64') {
            foreach ($name in 'windows-installation-absence.exe','windows-installation-absence.json') {
              $path = Join-Path $PWD "dist/runtime/verification/native/win32-$arch/$name"
              if (-not (Test-Path $path)) { $missing += "win32-$arch/$name" }
            }
          }
          if ($missing.Count) { throw "Packaging hook left native payloads missing: $($missing -join ', ')" }
          Write-Host 'both windows architectures staged under dist/runtime/verification/native'
      - name: Commit the produced payloads back to master
        # A clean checkout can only run npm pack when both payloads are committed.
        # [skip ci] keeps this commit from retriggering the workflow, whose path
        # filter contains data/verification, and an unchanged payload is a no-op.
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A data/verification/windows/win32-x64 data/verification/windows/win32-arm64
          if git diff --cached --quiet; then
            echo 'the committed payloads already match the payloads this run produced'
            exit 0
          fi
          git commit -m 'chore(verification): refresh the Windows absence payloads [skip ci]'
          git push
      - name: Report which architecture payloads are tracked
        # Surfaces the gap on runs that cannot commit (pull requests) and confirms
        # it is closed on master runs that just committed.
        shell: pwsh
        run: |
          foreach ($arch in 'x64','arm64') {
            $tracked = git ls-files "data/verification/windows/win32-$arch"
            if ($tracked) {
              Write-Host "tracked packaging input: win32-$arch"
            } else {
              Write-Host "::warning title=Untracked packaging input::data/verification/windows/win32-$arch is not tracked, so a clean checkout cannot run npm pack"
            }
          }
