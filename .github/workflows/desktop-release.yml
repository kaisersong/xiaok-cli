name: Desktop Release using macOS 26
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact Desktop 1.6.8 release tag
        required: true
permissions:
  contents: write
  actions: write
env:
  RELEASE_TAG: ${{ inputs.tag }}
  RELEASE_SHA: 6681e0e4c3be9ac321fcde87b94cef82a885dc1e
concurrency:
  group: desktop-release-macos26-1.6.8
  cancel-in-progress: false
jobs:
  build-mac:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/desktop-v1.6.8
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - name: Source provenance
        shell: bash
        run: |
          test "$RELEASE_TAG" = desktop-v1.6.8
          node scripts/desktop-release-identity.mjs check
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"
          node scripts/set-build-info.mjs release
      - name: Node headers
        uses: ./.github/actions/node-headers
      - name: Root dependencies
        shell: bash
        run: bash .github/scripts/retry.sh npm ci
      - name: Desktop dependencies
        shell: bash
        run: cd desktop && bash ../.github/scripts/retry.sh npm ci
      - name: Prepare Yunzhijia
        working-directory: desktop
        run: node scripts/prepare-packaged-yzj-cli.cjs
      - name: CLI lifecycle
        run: node --test tests/scripts/prepare-packaged-yzj-cli.test.mjs
      - name: Broker runtime
        run: cd desktop && node scripts/prepare-broker-runtime.mjs
      - name: Test packaged runtime dependency gate
        run: cd desktop && npm run test -- --run tests/main/packaged-runtime-imports.test.ts tests/main/packaged-runtime-dependencies.test.ts
      - name: SQLite binding
        shell: bash
        run: |
          node -e "const d=new (require('node:sqlite').DatabaseSync)(':memory:');d.exec('create table t(x)');console.log('root sqlite ok', d.prepare('select sqlite_version() v').get().v)"
          cd desktop && node -e "const d=new (require('node:sqlite').DatabaseSync)(':memory:');d.exec('create table t(x)');console.log('desktop sqlite ok')"
      - name: Clone sidecars
        run: |
          git clone --no-checkout --depth 1 https://github.com/kaisersong/kai-xiaok-plugins.git ../kai-xiaok-plugins
          git -C ../kai-xiaok-plugins fetch --depth 1 origin dd1315fb961e80f18f14f35d8511dcc2c6aac3ed
          git -C ../kai-xiaok-plugins checkout --detach FETCH_HEAD
          git clone --no-checkout --depth 1 https://github.com/kaisersong/kswarm.git ../kswarm
          git -C ../kswarm fetch --depth 1 origin 9f969b7912cc94e660643d390184bd0c6f00058f
          git -C ../kswarm checkout --detach FETCH_HEAD
          git clone --no-checkout --depth 1 https://github.com/kaisersong/intent-broker.git ../intent-broker
          git -C ../intent-broker fetch --depth 1 origin 21defd02854fc38ae7526cdff9de3f46bf137311
          git -C ../intent-broker checkout --detach FETCH_HEAD
      - uses: ./.github/actions/install-desktop-sidecars
      - name: Build report renderer
        shell: bash
        run: bash .github/scripts/build-report-renderer.sh
      - name: Build canvas
        shell: bash
        run: bash .github/scripts/build-canvas-bundles.sh
      - name: Download Python wheels (macOS)
        run: |
          wheel_dir="../kai-xiaok-plugins/plugins/kai-slide-creator/bundled-wheels"
          rm -rf "$wheel_dir"
          mkdir -p "$wheel_dir"
          for py in 311 312 313 314; do
            python3 -m pip download mcp==2.3.0 pydantic==2.13.4 jsonschema==4.26.0 beautifulsoup4 \
              -d "$wheel_dir" \
              --only-binary=:all: \
              --platform macosx_11_0_arm64 \
              --implementation cp \
              --python-version "$py" \
              --abi "cp$py" \
              --abi abi3 \
              --abi none
          done
      - name: Smoke test report-renderer
        run: |
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"test","version":"1.0"}}}' | timeout 5 node ../kai-xiaok-plugins/plugins/kai-report-creator/mcp-servers/report-renderer/dist/server.bundle.js || true
      - name: Vendor Mac runtimes
        run: |
          cd ../kai-xiaok-plugins
          node scripts/vendor-runtimes.mjs --runtime slide-python --target darwin-arm64
          node scripts/vendor-runtimes.mjs --runtime slide-python --target darwin-arm64 --verify
      - name: Artifact helper
        env:
          XIAOK_EXPORT_PACKAGE_INTEGRATION: '1'
        run: |
          node scripts/verification/prepare-artifact-export-toolchain.mjs
          node scripts/verification/build-artifact-export-helper.mjs --target darwin-arm64
          cd desktop && npm run test -- --run tests/main/artifact-export-package.test.ts
      - name: Audit source
        shell: bash
        run: &audit_source |
          git status --porcelain=v1 --untracked-files=all
          node --input-type=module -e 'import{verifyArtifact as v}from"./scripts/verification/copy-windows-absence.mjs";console.log(v("data/verification/windows/win32-x64","x64"))'
          derived=data/verification/windows/win32-x64/windows-installation-absence
          git diff --exit-code HEAD -- . ':(exclude)dist/**' ':(exclude)src/build-info.ts' ":(exclude)$derived.exe" ":(exclude)$derived.json"
      - name: Build desktop
        run: cd desktop && npm run build
        env:
          KSWARM_SOURCE_ROOT: ${{ github.workspace }}/../kswarm
      - name: Check signing secrets
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: bash --noprofile --norc -e -o pipefail .github/scripts/check-macos-signing-secrets.sh
      - name: Notary key
        shell: bash
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          key_id = os.environ["APPLE_API_KEY_ID"]
          key_path = Path(os.environ["RUNNER_TEMP"]) / f"AuthKey_{key_id}.p8"
          key_path.write_bytes(base64.b64decode(os.environ["APPLE_API_KEY_P8_BASE64"]))
          key_path.chmod(0o600)
          PY
      - name: Import certificate
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          cert_path="$RUNNER_TEMP/xiaok-developer-id.p12"
          keychain_path="$RUNNER_TEMP/xiaok-signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          cert_path = Path(os.environ["RUNNER_TEMP"]) / "xiaok-developer-id.p12"
          cert_path.write_bytes(base64.b64decode(os.environ["MACOS_CERTIFICATE_P12_BASE64"]))
          PY
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$cert_path" -k "$keychain_path" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain_path"
          echo "MACOS_SIGNING_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"
      - name: Sign wheels
        run: |
          python3 scripts/sign-macos-wheel-binaries.py \
            ../kai-xiaok-plugins/plugins/kai-slide-creator/bundled-wheels \
            --identity "Developer ID Application: Kai Song (Y9YR86UG94)" \
            --keychain "$MACOS_SIGNING_KEYCHAIN"
      - name: Load distribution hook
        run: git show "${RELEASE_SHA}:.github/scripts/macos-update-permissions.cjs" > "$RUNNER_TEMP/xiaok-macos-update-permissions.cjs"
      - name: Package signed macOS app
        run: cd desktop && npx electron-builder --config electron-builder.json --mac dir --arm64 --publish never -c.mac.forceCodeSigning=true -c.mac.notarize=false -c.afterPack="$RUNNER_TEMP/xiaok-macos-update-permissions.cjs"
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Notarize macOS app
        timeout-minutes: 135
        run: scripts/notarize-macos-app.sh desktop/release/mac-arm64/xiaok.app
        env:
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          NOTARY_ARCHIVE_KEY: ${{ env.RELEASE_SHA }}
          NOTARY_TIMEOUT_SECONDS: "7200"
          NOTARY_POLL_INTERVAL_SECONDS: "30"
          NOTARY_REUSE_IN_PROGRESS: "true"
          NOTARY_REUSE_WINDOW_SECONDS: "7200"
      - name: Package macOS distributables
        run: cd desktop && npx electron-builder --config electron-builder.json --mac dmg zip --arm64 --publish never --prepackaged release/mac-arm64/xiaok.app -c.mac.notarize=false
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: ZIP permissions
        run: python3 -c 'import glob,stat,zipfile; p=glob.glob("desktop/release/*-mac.zip"); assert len(p)==1; z=zipfile.ZipFile(p[0]); denied=[e.filename for e in z.infolist() if (stat.S_ISREG(e.external_attr>>16) or stat.S_ISDIR(e.external_attr>>16)) and not (e.external_attr>>16)&0o200]; assert not denied,denied; print("All ZIP regular files/directories permit owner quarantine removal")'
      - name: Verify macOS signature and notarization
        shell: bash
        run: |
          app_path="desktop/release/mac-arm64/xiaok.app"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign -dv --verbose=4 "$app_path" 2>&1 | tee "$RUNNER_TEMP/xiaok-codesign.txt"
          grep "TeamIdentifier=Y9YR86UG94" "$RUNNER_TEMP/xiaok-codesign.txt"
          xcrun stapler validate "$app_path"
      - name: ASAR source identity
        shell: bash
        env:
          PROVENANCE_ASAR: desktop/release/mac-arm64/xiaok.app/Contents/Resources/app.asar
        run: &verify_packaged_provenance |
          node - "$PROVENANCE_ASAR" <<'NODE'
          const assert = require('node:assert/strict');
          const path = require('node:path');
          const { extractFile } = require('./desktop/node_modules/@electron/asar');
          (async () => {
            const source = extractFile(process.argv[2], path.join('dist', 'main', 'src', 'build-info.js'));
            const { BUILD_INFO } = await import('data:text/javascript;base64,' + source.toString('base64'));
            assert.equal(BUILD_INFO.commit, process.env.RELEASE_SHA);
            assert.equal(BUILD_INFO.version, process.env.RELEASE_TAG.slice('desktop-v'.length));
            assert.equal(BUILD_INFO.dirty, false);
            console.log(JSON.stringify(BUILD_INFO));
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
      - name: Complete the existing release draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo=kaisersong/xiaok-cli
          original=44585561675
          state=$(gh run view "$original" -R "$repo" --json status,jobs)
          if jq -e '.jobs | any(.name == "build-mac" and .conclusion == "success")' <<<"$state" >/dev/null; then
            echo 'The original signed macOS artifacts are already available.'
          else
            if [[ $(jq -r .status <<<"$state") != completed ]]; then
              gh run cancel "$original" -R "$repo"
            fi
            for attempt in $(seq 1 36); do
              state=$(gh run view "$original" -R "$repo" --json status,jobs)
              [[ $(jq -r .status <<<"$state") != completed ]] || break
              sleep 5
            done
            [[ $(jq -r .status <<<"$state") == completed ]]
            if ! jq -e '.jobs | any(.name == "build-mac" and .conclusion == "success")' <<<"$state" >/dev/null; then
              node scripts/desktop-release-identity.mjs upload-mac
            fi
          fi
          node scripts/desktop-release-identity.mjs verify-draft
